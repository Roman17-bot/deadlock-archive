name: Refresh game data and publish

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Expected client version (optional; rejects a different patch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Acquire and verify the versioned snapshot
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          if [ -n "$EXPECTED_VERSION" ]; then
            npm run data:update -- --expected-version "$EXPECTED_VERSION"
          else
            npm run data:update
          fi
      - run: npm run data:check
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Save only verified game data and portraits
        run: |
          git add -- data/heroes.json data/provenance.json data/version-history.json public/assets/heroes/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: refresh verified game snapshot'
            git push origin HEAD:main
          fi
      # A GITHUB_TOKEN push does not trigger pages.yml. Deploy this verified build here.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
