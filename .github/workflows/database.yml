name: Check PostgreSQL archive

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: archive_ci_admin
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DEADLOCK_DB_HOST: 127.0.0.1
      DEADLOCK_DB_PORT: '5432'
      DEADLOCK_DB_NAME: deadlock_archive
      DEADLOCK_DB_TEST_NAME: deadlock_archive_test
      DEADLOCK_DB_USER: deadlock_archive_app
      DEADLOCK_DB_PASSWORD: archive_ci_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Create isolated CI databases and restricted application role
        env:
          PGPASSWORD: archive_ci_admin
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE deadlock_archive_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'archive_ci_app';"
          createdb -h 127.0.0.1 -U postgres -O deadlock_archive_app deadlock_archive
          createdb -h 127.0.0.1 -U postgres -O deadlock_archive_app deadlock_archive_test
      - run: npm run db:migrate
      - run: npm run db:import
      - run: npm run db:test
      - run: npm test
      - run: npm run typecheck
      - run: npm run data:check
