# Managed by Deadlock team: npm run team -- configure
[agents]
max_threads = 3

[agents.deadlock_heroes]
description = "Deadlock hero abilities, stats, builds, matchups and replay evidence."
config_file = "agents/deadlock-heroes.toml"

[agents.deadlock_items]
description = "Deadlock items, purchase timing, situational choices and item interactions."
config_file = "agents/deadlock-items.toml"

[agents.deadlock_mechanics]
description = "Deadlock formulas, stacking order, calculations and conflicting mechanical evidence."
config_file = "agents/deadlock-mechanics.toml"

[agents.deadlock_website]
description = "Deadlock Archive frontend, API implementation, accessibility and UI verification."
config_file = "agents/deadlock-website.toml"

[agents.deadlock_data]
description = "Deadlock Archive PostgreSQL, ingestion, patch provenance and exact Pages synchronization."
config_file = "agents/deadlock-data.toml"

[agents.deadlock_critic]
description = "Independent Deadlock project review for unsupported claims, stale evidence, regressions and scope drift."
config_file = "agents/deadlock-critic.toml"

[agents.deadlock_scout]
description = "Small read-only Deadlock lookups, file ownership checks and bounded verification tasks."
config_file = "agents/deadlock-scout.toml"

[agents.deadlock_designer]
description = "Deadlock Archive art direction, original SVG/Canvas/WebGL/3D and custom motion prototypes with rendered implementation handoff."
config_file = "agents/deadlock-designer.toml"

[agents.deadlock_designcritic]
description = "Read-only independent art direction, UX, accessibility, graphics, motion and performance review grounded in rendered evidence."
config_file = "agents/deadlock-designcritic.toml"

[mcp_servers.deadlock_playwright]
command = "cmd"
args = ["/d", "/c", "npx", "--yes", "--ignore-scripts", "@playwright/mcp@0.0.83", "--browser", "chrome", "--headless", "--isolated", "--allowed-origins", "http://localhost:*;http://127.0.0.1:*"]
startup_timeout_sec = 45
tool_timeout_sec = 60
enabled_tools = ["browser_navigate", "browser_snapshot", "browser_take_screenshot", "browser_console_messages", "browser_resize", "browser_click", "browser_type", "browser_press_key", "browser_evaluate", "browser_wait_for", "browser_close"]

[mcp_servers.deadlock_devtools]
command = "cmd"
args = ["/d", "/c", "npx", "--yes", "--ignore-scripts", "chrome-devtools-mcp@1.12.0", "--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux", "--no-file-navigations", "--allowed-url-pattern=http://127.0.0.1:*/*", "--allowed-url-pattern=http://localhost:*/*", "--allowed-url-pattern=ws://127.0.0.1:*/*", "--allowed-url-pattern=ws://localhost:*/*"]
startup_timeout_sec = 45
tool_timeout_sec = 60
enabled_tools = ["list_pages", "new_page", "navigate_page", "resize_page", "take_snapshot", "take_screenshot", "list_console_messages", "list_network_requests", "evaluate_script", "emulate", "wait_for", "performance_start_trace", "performance_stop_trace", "performance_analyze_insight", "close_page"]

[mcp_servers.deadlock_devtools.env]
CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS = "1"
CHROME_DEVTOOLS_MCP_NO_CONFIG_DISCOVERY = "1"
